<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Hawk 🦅 · Live Stream & Cache Monitor</title>
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --sink-color: #10b981;
      --win-color: #06b6d4;
      --empty-color: #1e293b;
      --mono: "JetBrains Mono", "Fira Code", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12), transparent 40%),
                  radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.12), transparent 40%),
                  var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.8fr 1.2fr;
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 20px;
    }
    label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
    textarea, input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
    }
    textarea { min-height: 100px; resize: vertical; font-family: var(--mono); }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .btn-group { display: flex; gap: 12px; margin-top: 16px; }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-gen { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    
    #output {
      margin-top: 16px;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* Cache visualizer */
    .cache-box {
      margin-top: 16px;
      padding: 14px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }
    .cache-bar {
      display: flex;
      height: 16px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
      background: var(--empty-color);
    }
    .sink-fill { background: var(--sink-color); width: 0%; transition: width 0.1s; }
    .win-fill { background: var(--win-color); width: 0%; transition: width 0.1s; }
    .legend { display: flex; justify-content: space-between; font-size: 11px; margin-top: 6px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: var(--card); border: 1px solid var(--card-border); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-val { font-size: 24px; font-weight: 800; font-family: var(--mono); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🦅 Little Hawk LLM</div>
    <div style="display:flex; gap:10px;">
      <span class="pill" id="mode-pill"><span class="dot" style="background:#facc15"></span>Conectando...</span>
      <span class="pill" id="status-pill"><span class="dot" style="background:#94a3b8"></span>Idle</span>
    </div>
  </div>

  <div class="grid">
    <!-- Painel de Geração -->
    <div class="card">
      <label>Prompt</label>
      <textarea id="prompt">The history of artificial intelligence began in ancient times with myths</textarea>

      <div class="row-3">
        <div><label>Max Tokens</label><input type="number" id="max_tokens" value="100" min="1" max="1000" /></div>
        <div><label>Temperatura</label><input type="number" id="temperature" value="0.7" step="0.05" /></div>
        <div><label>Top-p</label><input type="number" id="top_p" value="0.92" step="0.01" /></div>
      </div>
      <div class="row-3">
        <div><label>Top-k</label><input type="number" id="top_k" value="40" /></div>
        <div><label>Rep Penalty</label><input type="number" id="rep_penalty" value="1.15" step="0.05" /></div>
        <div><label>Min-p</label><input type="number" id="min_p" value="0.0" step="0.01" /></div>
      </div>

      <div class="btn-group">
        <button class="btn-gen" id="btn-go" onclick="startGeneration()">⚡ Gerar Streaming</button>
        <button class="btn-stop" id="btn-stop" onclick="stopGeneration()" disabled>⏹ Cancelar</button>
      </div>

      <div id="output"></div>
    </div>

    <!-- Monitor de Métricas e Cache O(1) -->
    <div class="card">
      <label>Métricas em Tempo Real</label>
      <div class="row-2" style="margin-top: 8px;">
        <div class="cache-box"><div class="muted">Throughput</div><div class="stat-val" id="tps" style="color:#38bdf8;">0.0 <span style="font-size:14px;color:var(--muted)">tok/s</span></div></div>
        <div class="cache-box"><div class="muted">Latência Média</div><div class="stat-val" id="lat" style="color:#818cf8;">– <span style="font-size:14px;color:var(--muted)">ms</span></div></div>
      </div>

      <div class="cache-box" style="margin-top:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; font-weight:700;">StreamingKVCache O(1)</span>
          <span style="font-size:12px; color:var(--muted); font-family:var(--mono);" id="cache-stats">0 / 512 slots</span>
        </div>
        <div class="cache-bar">
          <div class="sink-fill" id="sink-bar"></div>
          <div class="win-fill" id="win-bar"></div>
        </div>
        <div class="legend">
          <span>🟢 Sinks (0..3)</span>
          <span>🔵 Janela Deslizante (4..511)</span>
          <span>⚪ Vazio</span>
        </div>
      </div>

      <div class="row-2" style="margin-top: 14px;">
        <div class="cache-box"><div class="muted">Tokens Gerados</div><div class="stat-val" id="tok-count">0</div></div>
        <div class="cache-box"><div class="muted">Tempo Total</div><div class="stat-val" id="elapsed">0.0 <span style="font-size:14px;color:var(--muted)">s</span></div></div>
      </div>
    </div>
  </div>

  <script>
    let abortController = null;
    let startTime = null;
    let tokenCount = 0;

    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        const pill = document.getElementById('mode-pill');
        pill.innerHTML = `<span class="dot" style="background:#10b981"></span>Modo: ${data.mode} (concorrência: ${data.max_concurrency})`;
      } catch (e) {
        document.getElementById('mode-pill').innerHTML = `<span class="dot" style="background:#ef4444"></span>Offline`;
      }
    }

    async function startGeneration() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const body = {
        prompt,
        max_tokens: parseInt(document.getElementById('max_tokens').value),
        temperature: parseFloat(document.getElementById('temperature').value),
        top_p: parseFloat(document.getElementById('top_p').value),
        top_k: parseInt(document.getElementById('top_k').value),
        rep_penalty: parseFloat(document.getElementById('rep_penalty').value),
        min_p: parseFloat(document.getElementById('min_p').value)
      };

      document.getElementById('output').textContent = '';
      tokenCount = 0;
      startTime = performance.now();
      abortController = new AbortController();

      document.getElementById('btn-go').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      document.getElementById('status-pill').innerHTML = `<span class="dot" style="background:#38bdf8"></span>Gerando...`;

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: abortController.signal
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));
              if (data.token === '[DONE]') {
                break;
              }
              tokenCount++;
              document.getElementById('output').textContent += data.token;
              document.getElementById('output').scrollTop = document.getElementById('output').scrollHeight;

              const elapsed = (performance.now() - startTime) / 1000;
              const tps = tokenCount / elapsed;
              const lat = (elapsed / tokenCount) * 1000;

              document.getElementById('tok-count').textContent = tokenCount;
              document.getElementById('elapsed').innerHTML = `${elapsed.toFixed(1)} <span style="font-size:14px;color:var(--muted)">s</span>`;
              document.getElementById('tps').innerHTML = `${tps.toFixed(1)} <span style="font-size:14px;color:var(--muted)">tok/s</span>`;
              document.getElementById('lat').innerHTML = `${lat.toFixed(0)} <span style="font-size:14px;color:var(--muted)">ms</span>`;

              // Atualiza visual do cache
              const totalSlots = Math.min(tokenCount + 10, 512);
              const sinkPct = (Math.min(tokenCount + 10, 4) / 512) * 100;
              const winPct = (Math.max(0, Math.min(tokenCount + 10 - 4, 508)) / 512) * 100;

              document.getElementById('sink-bar').style.width = `${sinkPct}%`;
              document.getElementById('win-bar').style.width = `${winPct}%`;
              document.getElementById('cache-stats').textContent = `${totalSlots} / 512 slots`;
            }
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          document.getElementById('output').textContent += `\n[Erro: ${e.message}]`;
        }
      } finally {
        document.getElementById('btn-go').disabled = false;
        document.getElementById('btn-stop').disabled = true;
        document.getElementById('status-pill').innerHTML = `<span class="dot" style="background:#10b981"></span>Pronto`;
      }
    }

    function stopGeneration() {
      if (abortController) {
        abortController.abort();
      }
    }

    checkHealth();
  </script>
</body>
</html>
