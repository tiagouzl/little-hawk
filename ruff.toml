line-length = 120
target-version = "py310"
# Estilo compacto intencional — fora do formatador.
# engine/runtime corrigidos (RUF034/PLR0402/F811) e agora lint-clean; mantidos fora do
# formatador para preservar semi-colons compactos (verificados manualmente: `ruff check engine/ runtime/`).
# cli/transplants/examples/scripts já passam no lint quando verificados isoladamente,
# mantidos fora do lint/format global por legado.
extend-exclude = [
    "engine/",
    "runtime/",
    "cli/main.py",
    "transplants/",
    "examples/",
    "scripts/",
]

[lint]
# Relaxed rules because scripts usam estilo compacto/CLI.
ignore = [
    "E701", "E702", "E741", "E401", "F401", "F541", "F841",
    # Estilo legado dos scripts de transplant (compacto, exceções amplas)
    "I001",      # import block não ordenado
    "UP035",     # typing.Dict/List/Tuple (anotações legadas)
    "BLE001",    # except Exception amplo no download/transplant
    "S110",      # try/except/pass em fallbacks de download
    "RUF059",    # variável desempacotada não usada
]

[lint.extend-per-file-ignores]
"tests/*" = ["E402"]  # sys.path antes dos imports do projeto
